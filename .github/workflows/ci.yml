name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_call:
    inputs:
      postproject_ref:
        required: false
        type: string
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mediacreation: [bundled-nuke-17, current]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: postproject-org/postproject-openassetio-manager
      - uses: actions/checkout@v7
        with:
          repository: postproject-org/postproject
          ref: ${{ inputs.postproject_ref || 'main' }}
          path: postproject
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --release --locked -p postproject-ffi
        working-directory: postproject
      # Test the checked-out PostProject regardless of the declared version
      # range, so a PostProject version bump cannot fail this compatibility run.
      - name: Install against the checked-out PostProject
        run: |
          python -m pip install uv
          echo "postproject @ file://$GITHUB_WORKSPACE/postproject/python" \
            > "$RUNNER_TEMP/postproject-override.txt"
          python -m uv pip install --system \
            --override "$RUNNER_TEMP/postproject-override.txt" \
            ./postproject/python . pytest
      - name: Check the documented Nuke 17 library combination
        if: matrix.mediacreation == 'bundled-nuke-17'
        run: python -m pip install openassetio==1.0.0 openassetio-mediacreation==1.0.0a12
      - run: |
          mkdir -p evidence
          POSTPROJECT_ABI_TRACE="$PWD/evidence/openassetio-manager-abi.txt" \
            pytest -W error
        env:
          POSTPROJECT_LIBRARY: ${{ github.workspace }}/postproject/target/release/libpostproject.so
      - uses: actions/upload-artifact@v6
        with:
          name: openassetio-manager-postproject-usage-${{ matrix.mediacreation }}
          path: evidence/
          if-no-files-found: error
